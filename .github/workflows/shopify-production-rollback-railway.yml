name: Shopify Production Rollback To Railway

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ROLLBACK_TO_RAILWAY to restore the Railway Shopify URL configuration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shopify-production-rollback
  cancel-in-progress: false

jobs:
  rollback-to-railway:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'ROLLBACK_TO_RAILWAY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CI: "true"
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Verify Railway rollback identity and URL
        shell: bash
        run: |
          set -euo pipefail
          for name in SHOPIFY_APP_AUTOMATION_TOKEN SHOPIFY_API_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required cloudflare-production environment secret: $name" >&2
              exit 1
            fi
          done

          python - <<'PY'
          import os
          import tomllib

          with open("shopify.app.toml", "rb") as handle:
              config = tomllib.load(handle)

          if config["client_id"] != os.environ["SHOPIFY_API_KEY"]:
              raise SystemExit("Railway rollback Shopify client_id mismatch")
          if config["application_url"] != "https://vsn-metafields-production.up.railway.app":
              raise SystemExit("Railway rollback source URL drifted")
          PY

      - name: Create unreleased Railway rollback version
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_VERSION="railway-rollback-${GITHUB_RUN_NUMBER}"
          echo "$ROLLBACK_VERSION" > /tmp/rollback-version
          npx --yes @shopify/cli@4.8.2 app deploy \
            --no-release \
            --version "$ROLLBACK_VERSION" \
            --message "Emergency rollback to preserved Railway production URLs"

      - name: Release Railway rollback version
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_VERSION="$(cat /tmp/rollback-version)"
          npx --yes @shopify/cli@4.8.2 app release \
            --version "$ROLLBACK_VERSION" \
            --allow-updates
