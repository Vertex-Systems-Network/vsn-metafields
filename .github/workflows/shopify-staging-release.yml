name: Shopify Staging Release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE_METAFIELDS_TO_STAGING to build and release the development extension only to the staging app"
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: shopify-staging-release
  cancel-in-progress: false
jobs:
  release-staging-blocks:
    if: github.ref_name == 'development' && github.event.inputs.confirm == 'RELEASE_METAFIELDS_TO_STAGING'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      CI: "true"
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_APP_URL: ${{ secrets.SHOPIFY_APP_URL }}
    steps:
      - name: Checkout development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Require successful runtime acceptance for this development SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-staging-deploy.yml/runs?branch=development&head_sha=$GITHUB_SHA&status=success" > /tmp/staging-acceptance-runs.json
          python - <<'PY'
          import json, os
          runs = json.load(open('/tmp/staging-acceptance-runs.json'))['workflow_runs']
          if not any(r['head_sha'] == os.environ['GITHUB_SHA'] and r['conclusion'] == 'success' for r in runs):
              raise SystemExit('This exact development SHA has no successful staging runtime acceptance.')
          print('exact_development_staging_acceptance=pass')
          PY
      - name: Validate staging Shopify isolation and webhook contract
        run: python scripts/cloudflare/validate_shopify_staging_isolation.py
      - name: Install and verify block contracts
        run: |
          npm ci
          npm run test:contracts
      - name: Require and inject isolated staging identity
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          for name in ('SHOPIFY_APP_AUTOMATION_TOKEN', 'SHOPIFY_API_KEY', 'SHOPIFY_API_SECRET', 'SHOPIFY_APP_URL'):
              if not os.environ.get(name): raise SystemExit(f'Missing staging credential: {name}')
          production = tomllib.loads(Path('shopify.app.toml').read_text())['client_id']
          if os.environ['SHOPIFY_API_KEY'] == production: raise SystemExit('Refusing to release staging version with the production Shopify client ID.')
          if os.environ['SHOPIFY_APP_URL'] != 'https://vsn-metafields-staging.vertexsystemsnetwork.workers.dev': raise SystemExit('Unexpected staging URL.')
          path = Path('shopify.app.cloudflare-staging.toml')
          source = path.read_text()
          if '__SHOPIFY_STAGING_CLIENT_ID__' not in source: raise SystemExit('Missing staging identity placeholder.')
          path.write_text(source.replace('__SHOPIFY_STAGING_CLIENT_ID__', os.environ['SHOPIFY_API_KEY']))
          PY
      - name: Name this unique staging release attempt
        run: echo "STAGING_VERSION=staging-metafields-${GITHUB_SHA:0:12}-r${GITHUB_RUN_NUMBER}a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build and upload unreleased staging app version
        run: |
          npx --yes @shopify/cli@4.8.2 app deploy --config cloudflare-staging --no-release --version "$STAGING_VERSION" --message "Verified development metafield blocks"
      - name: Release only the staging app version
        run: |
          npx --yes @shopify/cli@4.8.2 app release --config cloudflare-staging --version "$STAGING_VERSION" --allow-updates
          npx --yes @shopify/cli@4.8.2 app versions list --config cloudflare-staging
          git diff --exit-code -- shopify.app.toml
          echo "production_app_changed=false"

      - name: Enqueue a synthetic customer data request
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes @shopify/cli@4.8.2 app webhook trigger \
              --config cloudflare-staging \
              --api-version 2026-07 \
              --address "$SHOPIFY_APP_URL/webhooks/customers/data_request" \
              --topic "customers/data_request" \
              --client-secret "$SHOPIFY_API_SECRET"; then
              echo "Shopify accepted the synthetic webhook; delivery and processing need separate confirmation."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Shopify webhook enqueue failed after three attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
