name: AI Native Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-native-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned ANPOS validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-anpos.txt

      - name: Compile repository scripts
        run: python -m compileall -q scripts

      - name: Test guarded history purge helper
        run: python -m unittest discover -s tests -p 'test_history_purge_helper.py'

      - name: Test Issue #41 ref-retirement readiness guard
        run: python -m unittest discover -s tests -p 'test_ref_retirement_readiness.py'

      - name: Test Issue #41 maintenance bundle builder
        run: python -m unittest discover -s tests -p 'test_issue_41_maintenance_bundle.py'

      - name: Test Issue #41 post-rewrite certification
        run: python -m unittest discover -s tests -p 'test_issue_41_post_rewrite_certification.py'

      - name: Test Issue #41 ref-retirement executor
        run: python -m unittest discover -s tests -p 'test_issue_41_ref_retirement_executor.py'

      - name: Verify fresh main clone has clean project history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vsn-metafields-fresh
          git clone --no-tags --single-branch --branch main \
            "https://github.com/Vertex-Systems-Network/vsn-metafields.git" \
            /tmp/vsn-metafields-fresh

          if git -C /tmp/vsn-metafields-fresh rev-list --objects --all | \
              awk 'NF > 1 && ($2 == "..git" || index($2, "..git/") == 1) { print; found=1 } END { exit found ? 0 : 1 }'
          then
            echo "Fresh main clone still exposes embedded Git metadata." >&2
            exit 1
          fi

          git -C /tmp/vsn-metafields-fresh fsck --full

      - name: Validate current AI-native state and workflow safety
        run: python scripts/validate_ai_native_repo.py

      - name: Validate commercial distribution and licensing blueprint
        run: python scripts/validate_commercial_licensing.py

      - name: Run protected-base validators against proposed tree
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:scripts/validate_ai_native_repo.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_ai_native_repo.py" > scripts/.trusted-base-validator.py
            if grep -q "child_vendor_only" scripts/.trusted-base-validator.py; then
              python scripts/.trusted-base-validator.py
            else
              echo 'Base validator predates child vendor-boundary awareness; current child-aware validator is authoritative for this one-time migration.'
            fi
            rm -f scripts/.trusted-base-validator.py
          else
            echo 'Base branch predates the ANPOS core validator; current validator and protected review remain required for this adoption.'
          fi

          if git cat-file -e "${BASE_SHA}:scripts/validate_commercial_licensing.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_commercial_licensing.py" > scripts/.trusted-base-commercial-validator.py
            python scripts/.trusted-base-commercial-validator.py
            rm -f scripts/.trusted-base-commercial-validator.py
          else
            echo 'Base branch predates commercial validator; current commercial validator and protected review remain required for this migration.'
          fi

      - name: Report control-plane changes for review evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD -- \
            AGENTS.md .ai .github blueprints scripts schemas tests config/coordination config/protocol \
            config/security config/consent config/github config/quality config/runtime config/release \
            config/licensing COMMERCIAL-LICENSING.md \
            CONTROL-PLANE-SECURITY.md PRODUCTION-ASSURANCE.md DESIGN-DATA-OPERATIONS.md \
            AUTO-AGENT.md SUPERVISOR.md ORCHESTRATOR.md MULTI-AGENT-ORCHESTRATION.md || true

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "valid yaml: #{f}" }' \
            .github/dependabot.yml .github/workflows/*.yml

      - name: Reject trailing whitespace in machine/code files
        shell: bash
        run: |
          if git grep -nE '[[:blank:]]+$' -- '*.py' '*.json' '*.yml' '*.yaml'; then
            echo 'Trailing whitespace found in machine/code files.' >&2
            exit 1
          fi

      - name: Show repository integrity success
        run: echo 'Repository integrity, JSON Schema, child-safe core/commercial validators, protected-base validation, workflow pinning, JSON, and YAML checks passed.'
