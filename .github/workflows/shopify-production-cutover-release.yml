name: Shopify Production Cutover Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE_PRODUCTION_CUTOVER to release an explicitly authorized Cloudflare production version"
        required: true
        type: string
      version:
        description: "Exact unreleased Shopify version name to release"
        required: true
        type: string
      subscription_snapshot_digest:
        description: "Exact SHA-256 subscription digest recorded by the cutover candidate run"
        required: true
        type: string
      subscription_shop_count:
        description: "Audited shop count recorded by the cutover candidate run"
        required: true
        type: string
      subscription_active_count:
        description: "Active subscription count recorded by the cutover candidate run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shopify-production-cutover-release
  cancel-in-progress: false

jobs:
  release-production-cutover:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'RELEASE_PRODUCTION_CUTOVER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      CI: "true"
      TARGET_VERSION: ${{ github.event.inputs.version }}
      EXPECTED_SUBSCRIPTION_SNAPSHOT_DIGEST: ${{ github.event.inputs.subscription_snapshot_digest }}
      EXPECTED_SUBSCRIPTION_SHOP_COUNT: ${{ github.event.inputs.subscription_shop_count }}
      EXPECTED_ACTIVE_SUBSCRIPTION_COUNT: ${{ github.event.inputs.subscription_active_count }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_API_KEY: f5266ba8dba403005deb695fedad053a
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_URL: https://vsn-metafields-production.vertexsystemsnetwork.workers.dev
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require explicit repository release authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          policy = json.loads(Path("config/cloudflare/production-cutover.json").read_text(encoding="utf-8"))
          target_version = os.environ["TARGET_VERSION"]
          worker = policy.get("production_worker") or {}

          if worker.get("deployment_completed") is not True or worker.get("acceptance_completed") is not True:
              raise SystemExit("Production Worker deployment/acceptance evidence is incomplete.")
          if worker.get("accepted_source_sha") != worker.get("certified_source_sha"):
              raise SystemExit("Accepted production Worker source does not match certified runtime source.")

          if policy.get("release_authorized") is not True:
              raise SystemExit("Production Shopify cutover release is not authorized in repository policy.")

          authorized_version = policy.get("authorized_version")
          authorized_source_ref = policy.get("authorized_source_ref")
          authorization_record = policy.get("authorization_record")

          if authorized_version != target_version:
              raise SystemExit(
                  f"Requested version is not the repository-authorized cutover version: {target_version}"
              )

          match = re.fullmatch(
              r"cloudflare-production-cutover-([0-9a-f]{12})-([0-9]+)",
              target_version,
          )
          if match is None:
              raise SystemExit("Production cutover version name does not match the certified format.")

          if not isinstance(authorized_source_ref, str) or len(authorized_source_ref) != 40:
              raise SystemExit("Authorized production source ref is missing or invalid.")
          if authorized_source_ref[:12] != match.group(1):
              raise SystemExit("Authorized source ref does not match the cutover candidate version.")

          if not isinstance(authorization_record, str) or not authorization_record.strip():
              raise SystemExit("Production cutover authorization record is missing.")

          print(f"authorized_cutover_version={authorized_version}")
          print(f"authorized_cutover_source_ref={authorized_source_ref}")
          print("production_worker_acceptance_evidence=certified")
          PY

      - name: Require production Shopify identity, target, and snapshot
        shell: bash
        run: |
          set -euo pipefail
          for name in SHOPIFY_APP_AUTOMATION_TOKEN SHOPIFY_API_SECRET DATABASE_URL TARGET_VERSION EXPECTED_SUBSCRIPTION_SNAPSHOT_DIGEST EXPECTED_SUBSCRIPTION_SHOP_COUNT EXPECTED_ACTIVE_SUBSCRIPTION_COUNT
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production cutover value: $name" >&2
              exit 1
            fi
          done

          if ! [[ "$EXPECTED_SUBSCRIPTION_SNAPSHOT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Subscription snapshot digest must be a lowercase SHA-256 value." >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_SUBSCRIPTION_SHOP_COUNT" =~ ^[0-9]+$ ]] || ! [[ "$EXPECTED_ACTIVE_SUBSCRIPTION_COUNT" =~ ^[0-9]+$ ]]; then
            echo "Subscription snapshot counts must be non-negative integers." >&2
            exit 1
          fi

          EXPECTED_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" != "$EXPECTED_CLIENT_ID" ]; then
            echo "Refusing production cutover release with a different Shopify app identity." >&2
            exit 1
          fi

          if [ "$SHOPIFY_APP_URL" != "https://vsn-metafields-production.vertexsystemsnetwork.workers.dev" ]; then
            echo "Refusing production cutover release for an unexpected target URL." >&2
            exit 1
          fi

      - name: Verify Cloudflare production Worker health before release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          policy = json.loads(Path("config/cloudflare/production-cutover.json").read_text(encoding="utf-8"))
          expected_sha = policy["production_worker"]["accepted_source_sha"]
          url = "https://vsn-metafields-production.vertexsystemsnetwork.workers.dev/healthz"

          last_error = None
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "vsn-metafields-production-release-smoke/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if payload.get("ok") is not True:
                      raise RuntimeError("Cloudflare production Worker health did not report ok=true")
                  if payload.get("commitSha") != expected_sha:
                      raise RuntimeError("Cloudflare production Worker source SHA drifted")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 6:
                      raise
                  time.sleep(attempt * 2)
          else:
              raise last_error or RuntimeError("Cloudflare production health returned no payload")

          print("production_pre_release_worker_health=pass")
          PY

      - name: Verify candidate subscription snapshot still matches before release
        run: node scripts/cloudflare/audit-production-subscriptions.mjs

      - name: Verify target Shopify version exists
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @shopify/cli@4.8.2 app versions list \
            --config cloudflare-production \
            --json > /tmp/shopify-production-versions.json
          grep -F "$TARGET_VERSION" /tmp/shopify-production-versions.json >/dev/null

      - name: Release exact production cutover version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @shopify/cli@4.8.2 app release \
            --config cloudflare-production \
            --version "$TARGET_VERSION" \
            --allow-updates

      - name: Verify Cloudflare production Worker health after release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://vsn-metafields-production.vertexsystemsnetwork.workers.dev/healthz"
          last_error = None
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "vsn-metafields-production-post-release-smoke/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if payload.get("ok") is not True:
                      raise RuntimeError("Cloudflare production Worker health did not report ok=true")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 6:
                      raise
                  time.sleep(attempt * 2)
          else:
              raise last_error or RuntimeError("Cloudflare production health returned no payload")

          print("production_post_release_worker_health=pass")
          PY

      - name: Verify existing subscriptions are unchanged after release
        run: |
          node scripts/cloudflare/audit-production-subscriptions.mjs
          echo "production_existing_subscriptions_preserved=pass"

      - name: Validate non-destructive production compliance webhook delivery
        shell: bash
        run: |
          set -euo pipefail

          trigger_webhook() {
            local topic="$1"
            local path="$2"
            npx --yes @shopify/cli@4.8.2 app webhook trigger \
              --config cloudflare-production \
              --api-version 2026-07 \
              --address "$SHOPIFY_APP_URL$path" \
              --topic "$topic" \
              --client-secret "$SHOPIFY_API_SECRET"
          }

          trigger_webhook "customers/data_request" "/webhooks/customers/data_request"
          trigger_webhook "customers/redact" "/webhooks/customers/redact"
          trigger_webhook "shop/redact" "/webhooks/shop/redact"

      - name: Preserve Railway rollback source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'application_url = "https://vsn-metafields-production.up.railway.app"' shopify.app.toml >/dev/null
          git diff --exit-code -- shopify.app.toml
