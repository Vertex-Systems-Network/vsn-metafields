name: Cloudflare Staging Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_DEVELOPMENT_TO_STAGING to deploy the development branch to isolated staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event.inputs.confirm == 'DEPLOY_DEVELOPMENT_TO_STAGING'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_APP_URL: ${{ secrets.SHOPIFY_APP_URL }}
      SCOPES: ${{ secrets.SCOPES }}
      STAGING_NEON_ENDPOINT_ID: ep-snowy-surf-b3gxl2wf

    steps:
      - name: Checkout development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Pin staging database SSL mode
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name in ("DATABASE_URL", "DIRECT_URL"):
                  parts = urlsplit(os.environ[name])
                  query = [(key, value) for key, value in parse_qsl(parts.query, keep_blank_values=True) if key.lower() != "sslmode"]
                  query.append(("sslmode", "verify-full"))
                  env_file.write(f"{name}={urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment))}\\n")
          PY

      - name: Require staging-only credentials and bindings
        shell: bash
        run: |
          set -euo pipefail
          for name in             CLOUDFLARE_API_TOKEN             CLOUDFLARE_ACCOUNT_ID             DATABASE_URL             DIRECT_URL             SHOPIFY_API_SECRET             SHOPIFY_API_KEY             SHOPIFY_APP_URL             SCOPES
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required cloudflare-staging environment secret: $name" >&2
              exit 1
            fi
          done

          PROD_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          python - <<'PY'
          import os
          from urllib.parse import urlparse

          expected = os.environ["STAGING_NEON_ENDPOINT_ID"]
          database_host = urlparse(os.environ["DATABASE_URL"]).hostname or ""
          direct_host = urlparse(os.environ["DIRECT_URL"]).hostname or ""

          if not database_host.endswith(".neon.tech") or not direct_host.endswith(".neon.tech"):
              raise SystemExit("Staging database URLs must both be Neon PostgreSQL endpoints.")

          pooled_id = database_host.split(".", 1)[0].removesuffix("-pooler")
          direct_id = direct_host.split(".", 1)[0].removesuffix("-pooler")
          if pooled_id != expected or direct_id != expected:
              raise SystemExit("Staging database secrets do not point to the certified staging Neon endpoint.")

          if "-pooler." not in database_host:
              raise SystemExit("Staging DATABASE_URL must use the pooled Neon endpoint.")
          if "-pooler." in direct_host:
              raise SystemExit("Staging DIRECT_URL must use the direct Neon endpoint.")

          print("staging_neon_identity=pass")
          PY

          if [ "$SHOPIFY_API_KEY" = "$PROD_CLIENT_ID" ]; then
            echo "Staging deploy must use the dedicated staging Shopify app identity, not production." >&2
            exit 1
          fi

          case "$SHOPIFY_APP_URL" in
            https://vsn-metafields-production.up.railway.app*)
              echo "Staging deploy must not use the Railway production Shopify URL." >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Validate migration invariants
        run: python scripts/cloudflare/validate_staging_contract.py

      - name: Validate Shopify production/staging isolation
        run: python scripts/cloudflare/validate_shopify_staging_isolation.py

      - name: Apply staging database migrations
        run: npx prisma migrate deploy

      - name: Verify staging database migration status
        run: npx prisma migrate status

      - name: Build staging Worker
        run: npm run build

      - name: Create ephemeral staging secrets file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          payload = {
              "DATABASE_URL": os.environ["DATABASE_URL"],
              "DIRECT_URL": os.environ["DIRECT_URL"],
              "SHOPIFY_API_SECRET": os.environ["SHOPIFY_API_SECRET"],
          }
          with open("/tmp/vsn-metafields-staging-secrets.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          chmod 600 /tmp/vsn-metafields-staging-secrets.json

      - name: Deploy isolated Cloudflare staging Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.141.0 deploy             --secrets-file /tmp/vsn-metafields-staging-secrets.json             --var "SHOPIFY_API_KEY:$SHOPIFY_API_KEY"             --var "SHOPIFY_APP_URL:$SHOPIFY_APP_URL"             --var "SCOPES:$SCOPES"             --var "APP_ENV:staging"

      - name: Verify deployed staging runtime contract
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${SHOPIFY_APP_URL%/}/healthz"

          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ["SHOPIFY_APP_URL"].rstrip("/") + "/healthz"
          last_error = None

          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "vsn-metafields-staging-smoke/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status != 200:
                          raise RuntimeError(f"unexpected HTTP status: {response.status}")
                      payload = json.loads(response.read().decode("utf-8"))

                  if payload.get("ok") is not True:
                      raise RuntimeError("health payload ok flag is not true")
                  if payload.get("service") != "vsn-metafields":
                      raise RuntimeError("unexpected service identity")

                  plan = payload.get("plan") or {}
                  expected = {
                      "id": "pro-plan",
                      "amount": 55,
                      "currencyCode": "USD",
                      "interval": "EVERY_30_DAYS",
                      "trialDays": 5,
                  }
                  if plan != expected:
                      raise RuntimeError(
                          f"deployed billing contract mismatch: expected={expected!r} actual={plan!r}"
                      )

                  print("staging_runtime_health=pass")
                  print("staging_billing_contract=5_days_usd_55")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 6:
                      raise
                  time.sleep(attempt * 2)
          PY

      - name: Resolve isolated staging shop from session store
        id: staging-shop
        shell: bash
        run: |
          set -euo pipefail
          SHOP="$(node scripts/cloudflare/resolve-staging-shop.mjs)"
          if [ -z "$SHOP" ]; then
            echo "No isolated staging shop session was resolved." >&2
            exit 1
          fi
          echo "shop=$SHOP" >> "$GITHUB_OUTPUT"
          echo "staging_shop_resolved=true"

      - name: Verify staging Shopify session and subscription reads
        env:
          STAGING_SHOP: ${{ steps.staging-shop.outputs.shop }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.request

          shop = os.environ["STAGING_SHOP"]
          path = "/internal/staging-acceptance"
          timestamp = str(int(time.time()))
          message = f"{timestamp}\n{shop}\n{path}".encode("utf-8")
          signature = hmac.new(
              os.environ["SHOPIFY_API_SECRET"].encode("utf-8"),
              message,
              hashlib.sha256,
          ).hexdigest()

          url = os.environ["SHOPIFY_APP_URL"].rstrip("/") + path
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "vsn-metafields-staging-acceptance/1.0",
                  "X-VSN-Shop": shop,
                  "X-VSN-Timestamp": timestamp,
                  "X-VSN-Signature": signature,
              },
          )

          payload = None
          last_error = None

          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  break
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      diagnostic = json.loads(body)
                  except json.JSONDecodeError:
                      diagnostic = {"raw": body[:500]}
                  print(
                      "staging_acceptance_http_error="
                      + json.dumps(
                          {
                              "status": exc.code,
                              "stage": diagnostic.get("stage"),
                              "code": diagnostic.get("code"),
                              "errorName": diagnostic.get("errorName"),
                              "directProbe": diagnostic.get("directProbe"),
                              "session": diagnostic.get("session"),
                          },
                          sort_keys=True,
                      )
                  )
                  last_error = exc
                  if attempt == 3:
                      raise
                  time.sleep(attempt * 2)

          if payload is None:
              raise last_error or RuntimeError("staging acceptance returned no payload")

          if payload.get("ok") is not True:
              raise RuntimeError(
                  "staging acceptance endpoint returned ok=false "
                  + json.dumps(
                      {
                          "stage": payload.get("stage"),
                          "code": payload.get("code"),
                          "session": payload.get("session"),
                      },
                      sort_keys=True,
                  )
              )

          session = payload.get("session") or {}
          if session.get("offlineSessionAvailable") is not True:
              raise RuntimeError("offline Shopify session is unavailable")
          if int(session.get("storedSessionCount", 0)) < 1:
              raise RuntimeError("no stored Shopify sessions were found")

          admin = payload.get("adminGraphql") or {}
          if admin.get("ok") is not True:
              raise RuntimeError("Shopify Admin GraphQL read did not pass")

          subscriptions = payload.get("subscriptions") or {}
          if subscriptions.get("readOk") is not True:
              raise RuntimeError("activeSubscriptions read did not return an array")

          print("staging_offline_session=pass")
          print("staging_admin_graphql=pass")
          print("staging_subscription_read=pass")
          print(f"staging_stored_sessions={session.get('storedSessionCount')}")
          print(f"staging_active_subscriptions={subscriptions.get('activeCount')}")
          PY

      - name: Remove ephemeral secrets file
        if: always()
        run: rm -f /tmp/vsn-metafields-staging-secrets.json

      - name: Metafield batch staging lifecycle and retained-value acceptance
        env:
          STAGING_SHOP: ${{ steps.staging-shop.outputs.shop }}
        run: node scripts/metafields/staging-probe.mjs
