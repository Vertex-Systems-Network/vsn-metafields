name: Dependency Audit Fix Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit-fix-preview.yml"

permissions:
  contents: write

jobs:
  audit-fix-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Apply non-force audit fixes to lockfile only
        shell: bash
        run: |
          set -euo pipefail
          cp package.json package.json.before-audit-fix
          npm audit fix --package-lock-only --ignore-scripts || true
          cmp --silent package.json package.json.before-audit-fix || {
            echo "package.json changed unexpectedly; refusing audit fix." >&2
            exit 1
          }

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No audit-fix lockfile delta remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): apply non-force npm audit lockfile fixes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
