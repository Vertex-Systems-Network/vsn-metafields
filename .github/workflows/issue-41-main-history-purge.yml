name: Issue 41 Main History Purge

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: read

concurrency:
  group: issue-41-main-history-purge
  cancel-in-progress: false

jobs:
  purge-main-history:
    if: >-
      github.event.issue.number == 41 &&
      github.actor == 'wpessential' &&
      startsWith(github.event.comment.body, 'EXECUTE_ISSUE_41_MAIN_PURGE_V1 ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Parse exact purge freeze anchors
        id: freeze
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          body = os.environ["COMMENT_BODY"].strip()
          match = re.fullmatch(
              r"EXECUTE_ISSUE_41_MAIN_PURGE_V1 "
              r"main=([0-9a-f]{40}) tree=([0-9a-f]{40})",
              body,
          )
          if not match:
              raise SystemExit("invalid Issue #41 purge trigger format")
          print(f"main={match.group(1)}")
          print(f"tree={match.group(2)}")
          PY

      - name: Verify main-only remote and maintenance window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_MAIN: ${{ steps.freeze.outputs.main }}
          EXPECTED_TREE: ${{ steps.freeze.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail

          open_prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_prs" = "0" || {
            echo "Open pull requests block history purge: $open_prs" >&2
            exit 1
          }

          mapfile -t heads < <(git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY.git")
          test "${#heads[@]}" -eq 1 || {
            printf 'Expected main-only remote, found %s heads\n' "${#heads[@]}" >&2
            exit 1
          }
          read -r remote_sha remote_ref <<< "${heads[0]}"
          test "$remote_ref" = "refs/heads/main" || {
            echo "Unexpected surviving ref: $remote_ref" >&2
            exit 1
          }
          test "$remote_sha" = "$EXPECTED_MAIN" || {
            echo "main moved after purge freeze" >&2
            exit 1
          }

          live_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_MAIN" --jq '.commit.tree.sha')"
          test "$live_tree" = "$EXPECTED_TREE" || {
            echo "main tree moved after purge freeze" >&2
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/rulesets/24085428" > /tmp/issue41-ruleset.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/issue41-ruleset.json", encoding="utf-8"))
          if data.get("enforcement") != "active":
              raise SystemExit("ruleset must remain active during maintenance")
          rule_types = {row.get("type") for row in data.get("rules", [])}
          if "non_fast_forward" in rule_types:
              raise SystemExit(
                  "ruleset still blocks force pushes; temporarily disable only "
                  "the non_fast_forward / Block force pushes rule"
              )
          PY

      - name: Install pinned history rewrite tool
        run: python -m pip install --disable-pip-version-check git-filter-repo==2.47.0

      - name: Rewrite main in isolated mirror
        env:
          EXPECTED_MAIN: ${{ steps.freeze.outputs.main }}
          EXPECTED_TREE: ${{ steps.freeze.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vsn-metafields-purge.git /tmp/issue41-pre /tmp/issue41-post
          git clone --mirror "https://github.com/$GITHUB_REPOSITORY.git" /tmp/vsn-metafields-purge.git

          python scripts/security/prepare_git_history_purge.py             --repo-dir /tmp/vsn-metafields-purge.git             --evidence-dir /tmp/issue41-pre             --expected-main "$EXPECTED_MAIN"             --approved-head main             --rewrite             --confirm PURGE_DOT_DOT_GIT_HISTORY

          after_tree="$(git -C /tmp/vsn-metafields-purge.git rev-parse 'refs/heads/main^{tree}')"
          test "$after_tree" = "$EXPECTED_TREE" || {
            echo "Application tree changed during local rewrite" >&2
            exit 1
          }

          rewritten_sha="$(git -C /tmp/vsn-metafields-purge.git rev-parse refs/heads/main)"
          test "$rewritten_sha" != "$EXPECTED_MAIN" || {
            echo "History rewrite did not change main commit SHA" >&2
            exit 1
          }
          echo "REWRITTEN_MAIN=$rewritten_sha" >> "$GITHUB_ENV"

      - name: Force-update main during authorized maintenance window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C /tmp/vsn-metafields-purge.git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C /tmp/vsn-metafields-purge.git config remote.origin.mirror false
          git -C /tmp/vsn-metafields-purge.git push --force origin refs/heads/main:refs/heads/main

          remote_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$REWRITTEN_MAIN" || {
            echo "Remote main does not match rewritten main" >&2
            exit 1
          }

      - name: Fresh-mirror certify rewritten remote
        env:
          EXPECTED_MAIN: ${{ steps.freeze.outputs.main }}
          EXPECTED_TREE: ${{ steps.freeze.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/verify-vsn-metafields.git
          git clone --mirror "https://github.com/$GITHUB_REPOSITORY.git" /tmp/verify-vsn-metafields.git

          python - <<'PY'
          import json
          import os
          payload = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "issue": 41,
              "main_before_sha": os.environ["EXPECTED_MAIN"],
              "main_before_tree_sha": os.environ["EXPECTED_TREE"],
              "expected_post_rewrite_heads": ["main"],
              "expected_post_rewrite_tags": [],
          }
          with open("/tmp/issue41-cert-bundle.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY

          python scripts/security/certify_issue_41_post_rewrite.py             --repo-dir /tmp/verify-vsn-metafields.git             --bundle /tmp/issue41-cert-bundle.json             --evidence-dir /tmp/issue41-post

          echo "rewritten_main=$REWRITTEN_MAIN"
          echo "ruleset_restore_required=true"
