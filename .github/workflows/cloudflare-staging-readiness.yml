name: Cloudflare Staging Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - "wrangler.jsonc"
      - "config/cloudflare/**"
      - "scripts/cloudflare/**"
      - "docs/cloudflare-migration-baseline.md"
      - "app/db.server.js"
      - "app/shopify.server.js"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-staging-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "wrangler.jsonc"
      - "config/cloudflare/**"
      - "scripts/cloudflare/**"
      - "docs/cloudflare-migration-baseline.md"
      - "app/db.server.js"
      - "app/shopify.server.js"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-staging-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration invariants
        run: python scripts/cloudflare/validate_staging_contract.py

      - name: Build React Router application
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/vsn_metafields
          DIRECT_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/vsn_metafields
          SHOPIFY_API_KEY: ci-placeholder
          SHOPIFY_API_SECRET: ci-placeholder
          SHOPIFY_APP_URL: https://staging.example.invalid
          SCOPES: read_products,write_products
        run: npm run build

      - name: Cloudflare Worker bundle dry-run
        run: npx --yes wrangler@4.141.0 deploy --dry-run --outdir /tmp/cloudflare-worker-dry-run
