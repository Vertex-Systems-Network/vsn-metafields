name: Cloudflare Staging Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - "wrangler.jsonc"
      - "config/cloudflare/**"
      - "scripts/cloudflare/**"
      - "tests/cloudflare/**"
      - "docs/cloudflare-migration-baseline.md"
      - "app/db.server.js"
      - "app/shopify.server.js"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-staging-readiness.yml"
      - ".github/workflows/cloudflare-staging-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "wrangler.jsonc"
      - "config/cloudflare/**"
      - "scripts/cloudflare/**"
      - "tests/cloudflare/**"
      - "docs/cloudflare-migration-baseline.md"
      - "app/db.server.js"
      - "app/shopify.server.js"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-staging-readiness.yml"
      - ".github/workflows/cloudflare-staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vsn_metafields_cf_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/vsn_metafields_cf_ci
      SHOPIFY_API_KEY: ci-placeholder
      SHOPIFY_API_SECRET: ci-placeholder
      SHOPIFY_APP_URL: http://127.0.0.1:8787
      SCOPES: read_products,write_products
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vsn_metafields_cf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vsn_metafields_cf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration invariants
        run: python scripts/cloudflare/validate_staging_contract.py

      - name: Prepare isolated PostgreSQL schema
        run: |
          npx prisma validate
          npx prisma migrate deploy

      - name: Build React Router application
        run: npm run build

      - name: Cloudflare Worker bundle dry-run
        run: npx --yes wrangler@4.141.0 deploy --dry-run --outdir /tmp/cloudflare-worker-dry-run

      - name: Workerd full app HTTP boot smoke
        run: node scripts/cloudflare/runtime-smoke.mjs app

      - name: Workerd PrismaPg Shopify session smoke
        run: node scripts/cloudflare/runtime-smoke.mjs session
