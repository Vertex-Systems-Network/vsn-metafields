name: Cloudflare Staging Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - "wrangler.jsonc"
      - "config/cloudflare/**"
      - "scripts/cloudflare/**"
      - "tests/cloudflare/**"
      - "docs/cloudflare-migration-baseline.md"
      - "app/db.server.js"
      - "app/shopify.server.js"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-staging-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "wrangler.jsonc"
      - "config/cloudflare/**"
      - "scripts/cloudflare/**"
      - "tests/cloudflare/**"
      - "docs/cloudflare-migration-baseline.md"
      - "app/db.server.js"
      - "app/shopify.server.js"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-staging-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vsn_metafields_cf_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/vsn_metafields_cf_ci
      SHOPIFY_API_KEY: ci-placeholder
      SHOPIFY_API_SECRET: ci-placeholder
      SHOPIFY_APP_URL: http://127.0.0.1:8787
      SCOPES: read_products,write_products
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vsn_metafields_cf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vsn_metafields_cf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration invariants
        run: python scripts/cloudflare/validate_staging_contract.py

      - name: Prepare isolated PostgreSQL schema
        run: |
          npx prisma validate
          npx prisma migrate deploy

      - name: Build React Router application
        run: npm run build

      - name: Cloudflare Worker bundle dry-run
        run: npx --yes wrangler@4.141.0 deploy --dry-run --outdir /tmp/cloudflare-worker-dry-run

      - name: Workerd full app HTTP boot smoke
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/vsn-metafields-workerd-app.log

          npx --yes wrangler@4.141.0 dev             --ip 127.0.0.1             --port 8787             --var "DATABASE_URL:$DATABASE_URL"             --var "DIRECT_URL:$DIRECT_URL"             --var "SHOPIFY_API_KEY:$SHOPIFY_API_KEY"             --var "SHOPIFY_API_SECRET:$SHOPIFY_API_SECRET"             --var "SHOPIFY_APP_URL:$SHOPIFY_APP_URL"             --var "SCOPES:$SCOPES"             >"$log" 2>&1 &
          pid=$!

          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              echo "Wrangler full-app process exited before becoming ready." >&2
              exit 1
            fi

            status="$(curl -sS -o /tmp/vsn-home.html -w '%{http_code}' http://127.0.0.1:8787/ || true)"
            if [ "$status" = "200" ] && grep -q "VSN Metafields" /tmp/vsn-home.html; then
              echo "workerd_full_app_http_boot=pass"
              exit 0
            fi
            sleep 1
          done

          cat "$log"
          echo "Full app did not become healthy in the Workers runtime." >&2
          exit 1

      - name: Workerd PrismaPg Shopify session smoke
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/vsn-metafields-workerd-session.log

          npx --yes wrangler@4.141.0 dev             --config tests/cloudflare/wrangler.session-smoke.jsonc             --ip 127.0.0.1             --port 8788             --var "DATABASE_URL:$DATABASE_URL"             >"$log" 2>&1 &
          pid=$!

          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              echo "Wrangler session-smoke process exited before becoming ready." >&2
              exit 1
            fi

            status="$(curl -sS -o /tmp/vsn-session.json -w '%{http_code}' http://127.0.0.1:8788/ || true)"
            if [ "$status" = "200" ]; then
              python - <<'PY'
          import json

          with open("/tmp/vsn-session.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          assert payload == {
              "ok": True,
              "runtime": "cloudflare-workers",
              "prismaAdapter": "PrismaPg",
              "sessionStorage": "PrismaSessionStorage",
          }, payload
          print("workerd_prisma_session_roundtrip=pass")
          PY
              exit 0
            fi
            sleep 1
          done

          cat "$log"
          cat /tmp/vsn-session.json 2>/dev/null || true
          echo "Prisma session smoke did not become healthy in the Workers runtime." >&2
          exit 1
