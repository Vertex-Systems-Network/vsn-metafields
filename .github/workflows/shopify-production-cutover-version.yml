name: Shopify Production Cutover Candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE_PRODUCTION_CUTOVER_VERSION to create an unreleased Cloudflare production Shopify version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shopify-production-cutover-candidate
  cancel-in-progress: false

jobs:
  create-production-cutover-candidate:
    if: github.event.inputs.confirm == 'CREATE_PRODUCTION_CUTOVER_VERSION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CI: "true"
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_APP_URL: ${{ secrets.SHOPIFY_APP_URL }}

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Require production Shopify identity
        shell: bash
        run: |
          set -euo pipefail
          for name in SHOPIFY_APP_AUTOMATION_TOKEN SHOPIFY_API_KEY SHOPIFY_APP_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required cloudflare-production environment secret: $name" >&2
              exit 1
            fi
          done

          EXPECTED_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" != "$EXPECTED_CLIENT_ID" ]; then
            echo "Refusing production cutover candidate with a different Shopify app identity." >&2
            exit 1
          fi

          if [ "$SHOPIFY_APP_URL" != "https://vsn-metafields-production.vertexsystemsnetwork.workers.dev" ]; then
            echo "Refusing production cutover candidate for an unexpected target URL." >&2
            exit 1
          fi

      - name: Validate prepared production cutover contract
        run: python scripts/cloudflare/validate_production_cutover_contract.py

      - name: Create unreleased production cutover version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="cloudflare-production-cutover-${GITHUB_RUN_NUMBER}"
          echo "candidate_version=$VERSION"
          npx --yes @shopify/cli@4.8.2 app deploy \
            --config cloudflare-production \
            --no-release \
            --version "$VERSION" \
            --message "Prepared Cloudflare production URL cutover candidate"

      - name: Confirm Railway source config remains untouched
        run: git diff --exit-code -- shopify.app.toml
