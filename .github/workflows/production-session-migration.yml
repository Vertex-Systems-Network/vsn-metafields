name: Production Session Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MIGRATE_SUPABASE_SESSIONS_TO_NEON to copy production Shopify sessions into the certified Neon database"
        required: true
        type: string
      expected_source_session_count:
        description: "Exact audited source Session row count"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: production-session-migration
  cancel-in-progress: false

jobs:
  migrate-production-sessions:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'MIGRATE_SUPABASE_SESSIONS_TO_NEON'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      CI: "true"
      SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_SOURCE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      TARGET_DIRECT_URL: ${{ secrets.DIRECT_URL }}
      MIGRATION_CONFIRMATION: ${{ github.event.inputs.confirm }}
      EXPECTED_SOURCE_SESSION_COUNT: ${{ github.event.inputs.expected_source_session_count }}
      STAGING_NEON_ENDPOINT_ID: ep-snowy-surf-b3gxl2wf
      PRODUCTION_NEON_PROJECT_NAME: vsn-metafields-production
      EXPECTED_PRODUCTION_ENDPOINT_ID: ep-flat-mouse-b5z1wu54

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Require migration-only secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_SOURCE_DATABASE_URL DATABASE_URL
          do
            case "$name" in
              SUPABASE_SOURCE_DATABASE_URL) value="$SOURCE_DATABASE_URL" ;;
              DATABASE_URL) value="$DATABASE_URL" ;;
            esac
            if [ -z "$value" ]; then
              echo "Missing required cloudflare-production environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Resolve production Neon direct URL
        run: python scripts/database/resolve-production-neon-urls.py

      - name: Require distinct production Neon target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'

          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          policy = json.loads(
              Path("config/cloudflare/production-cutover.json").read_text(encoding="utf-8")
          )
          database = policy.get("database") or {}
          staging_id = database.get("staging_endpoint_id")
          production_id = database.get("production_endpoint_id")

          if database.get("production_project_provisioned") is not True:
              raise SystemExit("Production Neon project is not certified as provisioned.")
          if database.get("production_schema_provisioned") is not True:
              raise SystemExit("Production Neon schema provisioning is not certified complete.")
          if not isinstance(production_id, str) or not production_id.startswith("ep-"):
              raise SystemExit("Certified production Neon endpoint ID is missing.")
          if production_id == staging_id:
              raise SystemExit("Production and staging Neon endpoint IDs must be different.")

          database_host = urlparse(os.environ["DATABASE_URL"]).hostname or ""
          direct_host = urlparse(os.environ["DIRECT_URL"]).hostname or ""

          if not database_host.endswith(".neon.tech") or not direct_host.endswith(".neon.tech"):
              raise SystemExit("Production database URLs must both be Neon PostgreSQL endpoints.")

          pooled_id = database_host.split(".", 1)[0].removesuffix("-pooler")
          direct_id = direct_host.split(".", 1)[0].removesuffix("-pooler")

          if pooled_id != direct_id:
              raise SystemExit("Production DATABASE_URL and DIRECT_URL must point to the same Neon endpoint.")
          if pooled_id == staging_id:
              raise SystemExit("Production migration must not use the staging Neon endpoint.")
          if pooled_id != production_id:
              raise SystemExit("Production database URLs do not match the repository-certified production Neon endpoint.")
          if "-pooler." not in database_host:
              raise SystemExit("Production DATABASE_URL must use the pooled Neon endpoint.")
          if "-pooler." in direct_host:
              raise SystemExit("Production DIRECT_URL must use the direct Neon endpoint.")

          print("production_neon_identity=certified_and_distinct")
          print("production_neon_project_name=vsn-metafields-production")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Require clean Neon Prisma schema
        shell: bash
        run: |
          set -euo pipefail
          npx prisma migrate status
          echo "production_neon_schema_status=pass"

      - name: Copy and verify production Shopify sessions
        run: node scripts/database/migrate-production-sessions.mjs

      - name: Record safe migration evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "production_session_migration_source=supabase"
          echo "production_session_migration_target=neon"
          echo "production_session_migration_expected_count=$EXPECTED_SOURCE_SESSION_COUNT"
          echo "production_session_credentials_logged=false"
          echo "production_shopify_cutover_performed=false"
          echo "production_billing_mutation_performed=false"
