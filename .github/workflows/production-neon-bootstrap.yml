name: Production Neon Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BOOTSTRAP_ISOLATED_NEON_PRODUCTION to initialize the new isolated production Neon database"
        required: true
        type: string
      production_endpoint_id:
        description: "Exact Neon endpoint ID for the new vsn-metafields-production project (ep-...)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-neon-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-production-neon:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'BOOTSTRAP_ISOLATED_NEON_PRODUCTION'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      CI: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      EXPECTED_PRODUCTION_ENDPOINT_ID: ${{ github.event.inputs.production_endpoint_id }}
      STAGING_NEON_ENDPOINT_ID: ep-snowy-surf-b3gxl2wf
      PRODUCTION_NEON_PROJECT_NAME: vsn-metafields-production

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Require isolated production Neon identity
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL DIRECT_URL EXPECTED_PRODUCTION_ENDPOINT_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production Neon value: $name" >&2
              exit 1
            fi
          done

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          expected = os.environ["EXPECTED_PRODUCTION_ENDPOINT_ID"]
          policy = json.loads(
              Path("config/cloudflare/production-cutover.json").read_text(encoding="utf-8")
          )
          database = policy.get("database") or {}
          staging = database.get("staging_endpoint_id")
          certified = database.get("production_endpoint_id")

          if database.get("production_project_name") != "vsn-metafields-production":
              raise SystemExit("Production Neon project name is not repository-certified.")
          if database.get("production_project_provisioned") is not True:
              raise SystemExit("Production Neon project is not repository-certified as provisioned.")
          if re.fullmatch(r"ep-[a-z0-9-]+", expected) is None:
              raise SystemExit("Production endpoint ID must match ep-[a-z0-9-]+.")
          if certified != expected:
              raise SystemExit("Requested production endpoint does not match repository policy.")
          if expected == staging:
              raise SystemExit("Production Neon endpoint must differ from the certified staging endpoint.")

          database_host = urlparse(os.environ["DATABASE_URL"]).hostname or ""
          direct_host = urlparse(os.environ["DIRECT_URL"]).hostname or ""

          if not database_host.endswith(".neon.tech") or not direct_host.endswith(".neon.tech"):
              raise SystemExit("Production database URLs must both be Neon PostgreSQL endpoints.")

          pooled_id = database_host.split(".", 1)[0].removesuffix("-pooler")
          direct_id = direct_host.split(".", 1)[0].removesuffix("-pooler")

          if pooled_id != direct_id:
              raise SystemExit("Production DATABASE_URL and DIRECT_URL must point to the same Neon endpoint.")
          if pooled_id != expected:
              raise SystemExit("Production database URLs do not match the requested production Neon endpoint.")
          if pooled_id == staging:
              raise SystemExit("Production bootstrap must never use the staging Neon endpoint.")
          if "-pooler." not in database_host:
              raise SystemExit("Production DATABASE_URL must use the pooled Neon endpoint.")
          if "-pooler." in direct_host:
              raise SystemExit("Production DIRECT_URL must use the direct Neon endpoint.")

          print("production_neon_bootstrap_identity=pass")
          print("production_neon_project_name=vsn-metafields-production")
          print(f"production_neon_endpoint_id={expected}")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Require empty production Session target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from "pg";
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DIRECT_URL });
          await client.connect();
          try {
            const relation = await client.query(
              `select to_regclass('public."Session"')::text as session_table`
            );
            if (relation.rows[0]?.session_table) {
              const count = await client.query('select count(*)::int as count from public."Session"');
              if (count.rows[0].count !== 0) {
                throw new Error(
                  `Production bootstrap target already contains ${count.rows[0].count} Session rows.`
                );
              }
            }
            console.log("production_neon_bootstrap_preexisting_sessions=0");
          } finally {
            await client.end();
          }
          NODE

      - name: Apply production Prisma schema
        run: npx prisma migrate deploy

      - name: Verify production Prisma schema
        run: npx prisma migrate status

      - name: Verify clean production Session table
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from "pg";
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DIRECT_URL });
          await client.connect();
          try {
            const relation = await client.query(
              `select to_regclass('public."Session"')::text as session_table,
                      to_regclass('public."_prisma_migrations"')::text as migration_table`
            );
            if (!relation.rows[0]?.session_table) {
              throw new Error("Production Session table was not created by Prisma migrations.");
            }
            if (!relation.rows[0]?.migration_table) {
              throw new Error("Prisma migration history table is missing after bootstrap.");
            }

            const count = await client.query('select count(*)::int as count from public."Session"');
            if (count.rows[0].count !== 0) {
              throw new Error("Production Session table must remain empty before source migration.");
            }

            const migrations = await client.query(
              'select count(*)::int as count from public."_prisma_migrations" where finished_at is not null'
            );
            if (migrations.rows[0].count < 1) {
              throw new Error("No completed Prisma migrations were recorded.");
            }

            console.log("production_neon_bootstrap_schema=pass");
            console.log("production_neon_bootstrap_session_count=0");
            console.log(`production_neon_bootstrap_migrations=${migrations.rows[0].count}`);
          } finally {
            await client.end();
          }
          NODE

      - name: Record safe bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "production_neon_bootstrap=pass"
          echo "production_neon_bootstrap_target=vsn-metafields-production"
          echo "production_neon_bootstrap_endpoint=$EXPECTED_PRODUCTION_ENDPOINT_ID"
          echo "production_shopify_cutover_performed=false"
          echo "production_billing_mutation_performed=false"
          echo "production_session_migration_performed=false"
