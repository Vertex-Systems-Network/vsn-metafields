name: Cloudflare Production Acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VERIFY_PRODUCTION_WORKER_ONLY to verify the already-deployed production Worker without changing Shopify URLs"
        required: true
        type: string
      source_sha:
        description: "Exact 40-character commit SHA expected to be running on the production Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-acceptance
  cancel-in-progress: false

jobs:
  verify-production-worker:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'VERIFY_PRODUCTION_WORKER_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CI: "true"
      EXPECTED_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      STAGING_NEON_ENDPOINT_ID: ep-snowy-surf-b3gxl2wf
      PRODUCTION_NEON_PROJECT_NAME: vsn-metafields-production
      SHOPIFY_APP_URL: https://vsn-metafields-production.vertexsystemsnetwork.workers.dev

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Require immutable production source evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production source SHA must be an exact 40-character lowercase commit SHA." >&2
            exit 1
          fi

          POLICY_SOURCE_SHA="$(python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(
              Path("config/cloudflare/production-cutover.json").read_text(encoding="utf-8")
          )
          print(policy["production_worker"]["certified_source_sha"])
          PY
          )"

          if [ "$EXPECTED_SOURCE_SHA" != "$POLICY_SOURCE_SHA" ]; then
            echo "Acceptance source does not match the repository-certified Worker source." >&2
            echo "requested=$EXPECTED_SOURCE_SHA" >&2
            echo "certified=$POLICY_SOURCE_SHA" >&2
            exit 1
          fi

          echo "expected_production_source_sha=$EXPECTED_SOURCE_SHA"

      - name: Require distinct production Neon target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'

          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          policy = json.loads(
              Path("config/cloudflare/production-cutover.json").read_text(encoding="utf-8")
          )
          database = policy.get("database") or {}
          staging_id = database.get("staging_endpoint_id")
          production_id = database.get("production_endpoint_id")

          if database.get("production_project_provisioned") is not True:
              raise SystemExit("Production Neon project is not certified as provisioned.")
          if database.get("production_schema_provisioned") is not True:
              raise SystemExit("Production Neon schema provisioning is not certified complete.")
          if database.get("session_migration_completed") is not True:
              raise SystemExit("Production Session migration is not certified complete.")
          if not isinstance(production_id, str) or not production_id.startswith("ep-"):
              raise SystemExit("Certified production Neon endpoint ID is missing.")
          if production_id == staging_id:
              raise SystemExit("Production and staging Neon endpoint IDs must be different.")

          database_host = urlparse(os.environ["DATABASE_URL"]).hostname or ""
          direct_host = urlparse(os.environ["DIRECT_URL"]).hostname or ""

          if not database_host.endswith(".neon.tech") or not direct_host.endswith(".neon.tech"):
              raise SystemExit("Production database URLs must both be Neon PostgreSQL endpoints.")

          pooled_id = database_host.split(".", 1)[0].removesuffix("-pooler")
          direct_id = direct_host.split(".", 1)[0].removesuffix("-pooler")

          if pooled_id != direct_id:
              raise SystemExit("Production DATABASE_URL and DIRECT_URL must point to the same Neon endpoint.")
          if pooled_id == staging_id:
              raise SystemExit("Production acceptance must not use the staging Neon endpoint.")
          if pooled_id != production_id:
              raise SystemExit("Production database URLs do not match the repository-certified production Neon endpoint.")
          if "-pooler." not in database_host:
              raise SystemExit("Production DATABASE_URL must use the pooled Neon endpoint.")
          if "-pooler." in direct_host:
              raise SystemExit("Production DIRECT_URL must use the direct Neon endpoint.")

          print("production_neon_identity=certified_and_distinct")
          print("production_neon_project_name=vsn-metafields-production")
          PY

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Require production database values
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL DIRECT_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required cloudflare-production environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Validate prepared production cutover contract
        run: python scripts/cloudflare/validate_production_cutover_contract.py

      - name: Verify production database migration status read-only
        shell: bash
        run: |
          set -euo pipefail
          npx prisma validate
          npx prisma migrate status
          echo "production_database_migration_status=pass"

      - name: Verify production Session table read-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createPrismaClient } from "./app/db.server.js";

          const prisma = createPrismaClient();
          try {
            await prisma.session.count();
            console.log("production_session_table_read=pass");
          } finally {
            await prisma.$disconnect();
          }
          NODE

      - name: Verify deployed production Worker health contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          expected_url = "https://vsn-metafields-production.vertexsystemsnetwork.workers.dev"
          if os.environ["SHOPIFY_APP_URL"] != expected_url:
              raise SystemExit("production Worker URL mismatch")

          with urllib.request.urlopen(expected_url + "/healthz", timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"unexpected production health status: {response.status}")
              payload = json.loads(response.read().decode("utf-8"))

          expected_source_sha = os.environ["EXPECTED_SOURCE_SHA"]
          if payload.get("commitSha") != expected_source_sha:
              raise SystemExit(
                  f"production Worker source mismatch: expected {expected_source_sha}, got {payload.get('commitSha')!r}"
              )

          expected_plan = {
              "id": "pro-plan",
              "amount": 55,
              "currencyCode": "USD",
              "interval": "EVERY_30_DAYS",
              "trialDays": 5,
          }

          if payload.get("ok") is not True:
              raise SystemExit("production Worker health did not report ok=true")
          if payload.get("service") != "vsn-metafields":
              raise SystemExit("production Worker service identity mismatch")
          if payload.get("plan") != expected_plan:
              raise SystemExit(f"production Worker billing metadata mismatch: {payload!r}")

          print(f"production_worker_source_sha={expected_source_sha}")
          print("production_worker_health=pass")
          print("production_billing_metadata=pass")
          PY

      - name: Confirm Railway remains Shopify live target and release stays unauthorized
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          with open("shopify.app.toml", "rb") as handle:
              current = tomllib.load(handle)

          policy = json.loads(
              Path("config/cloudflare/production-cutover.json").read_text(encoding="utf-8")
          )

          railway_url = "https://vsn-metafields-production.up.railway.app"
          if current.get("application_url") != railway_url:
              raise SystemExit("Shopify live application URL no longer points to Railway")
          if policy.get("release_authorized") is not False:
              raise SystemExit("production release unexpectedly authorized")
          if policy.get("authorized_version") is not None:
              raise SystemExit("production authorized version must remain unset")
          if policy.get("authorized_source_ref") is not None:
              raise SystemExit("production authorized source ref must remain unset")

          print("production_worker_acceptance=pass")
          print("production_shopify_live_target=railway")
          print("production_release_authorized=false")
          print("production_shopify_cutover_performed=false")
          print("production_billing_mutation_performed=false")
          PY
