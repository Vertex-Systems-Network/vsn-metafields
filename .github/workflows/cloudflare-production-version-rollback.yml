name: Cloudflare Production Version Rollback

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ROLLBACK_CLOUDFLARE_PRODUCTION_VERSION to activate the certified pre-hotfix Worker version"
        required: true
        type: string
      version_id:
        description: "Exact certified Cloudflare Worker version ID from production policy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-version-rollback
  cancel-in-progress: false

jobs:
  rollback-production-version:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'ROLLBACK_CLOUDFLARE_PRODUCTION_VERSION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CI: "true"
      REQUESTED_ROLLBACK_VERSION_ID: ${{ github.event.inputs.version_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f63cf3af0868a5c8a0b26ebee5dd039f

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Require exact certified rollback version
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing required cloudflare-production environment secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(
              Path("config/cloudflare/production-cutover.json").read_text(encoding="utf-8")
          )
          rollback = policy.get("rollback") or {}
          window = rollback.get("window") or {}
          shopify = policy.get("shopify") or {}

          requested = os.environ["REQUESTED_ROLLBACK_VERSION_ID"]
          expected = rollback.get("cloudflare_rollback_version_id")

          if shopify.get("live_target") != "cloudflare":
              raise SystemExit("Cloudflare is not the repository-recorded production live target.")
          if rollback.get("strategy") != "cloudflare_worker_version":
              raise SystemExit("Repository rollback strategy is not Cloudflare Worker version rollback.")
          if rollback.get("prepared_workflow") != "cloudflare-production-version-rollback.yml":
              raise SystemExit("Cloudflare rollback workflow policy drifted.")
          if window.get("status") != "active":
              raise SystemExit("Production rollback window is not active.")
          if requested != expected:
              raise SystemExit("Requested Cloudflare rollback version is not repository-certified.")

          print("production_cloudflare_rollback_request=certified")
          print(f"production_cloudflare_rollback_version={requested}")
          PY

      - name: Verify certified rollback version remains available
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.141.0 versions view "$REQUESTED_ROLLBACK_VERSION_ID"             --name vsn-metafields-production             --json > /tmp/vsn-metafields-rollback-version.json
          grep -F "$REQUESTED_ROLLBACK_VERSION_ID" /tmp/vsn-metafields-rollback-version.json >/dev/null
          echo "production_cloudflare_rollback_version_available=pass"

      - name: Activate certified rollback version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.141.0 rollback "$REQUESTED_ROLLBACK_VERSION_ID"             --name vsn-metafields-production             --message "VSN MetaFields emergency rollback to certified pre-hotfix Worker version"

      - name: Verify rollback Worker health and source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://vsn-metafields-production.vertexsystemsnetwork.workers.dev/healthz"
          expected = "c184b25628fc5c59a1110c6fe9ec49e11ce31b05"

          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "vsn-metafields-cloudflare-version-rollback/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if payload.get("ok") is not True:
                      raise RuntimeError("Rollback Worker is unhealthy.")
                  if payload.get("commitSha") != expected:
                      raise RuntimeError(
                          f"Rollback Worker source mismatch: expected {expected}, got {payload.get('commitSha')!r}"
                      )
                  break
              except Exception:
                  if attempt == 6:
                      raise
                  time.sleep(attempt * 2)

          print("production_cloudflare_version_rollback=pass")
          print("production_shopify_config_mutation_performed=false")
          print("production_billing_mutation_performed=false")
          print("production_database_mutation_performed=false")
          PY
