version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      shopify:
        patterns:
          - "@shopify/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(actions)
