<rect x="0" y="70" width="960" height="48" rx="0" fill="#fff" stroke="#dce5df"/>
<rect x="24" y="78" width="155" height="32" rx="6" fill="#eaf4ed" stroke="#eaf4ed"/>
<text x="34" y="99" font-size="13" fill="#126b4c" font-weight="600">Fields &amp; values</text>
<text x="197" y="99" font-size="13" fill="#54655f" font-weight="600">Metaobjects</text>
<text x="337" y="99" font-size="13" fill="#54655f" font-weight="600">Import &amp; export</text>
<text x="500" y="99" font-size="13" fill="#54655f" font-weight="600">Plans</text>
<text x="640" y="99" font-size="13" fill="#54655f" font-weight="600">Help center</text>
<text x="32" y="156" font-size="24" fill="#172b26" font-weight="700">Resource values</text>
<rect x="32" y="180" width="570" height="386" rx="10" fill="#fff" stroke="#dce5df"/>
<rect x="626" y="180" width="302" height="386" rx="10" fill="#17382d" stroke="#17382d"/>
<text x="54" y="205" font-size="13" fill="#54655f" font-weight="600">Resource</text>
<rect x="54" y="214" width="526" height="38" rx="10" fill="#fff" stroke="#dce5df"/>
<text x="68" y="239" font-size="15" fill="#172b26" font-weight="400">Example cotton shirt</text>
<text x="54" y="275" font-size="13" fill="#54655f" font-weight="600">Definition</text>
<rect x="54" y="284" width="526" height="38" rx="10" fill="#fff" stroke="#dce5df"/>
<text x="68" y="309" font-size="15" fill="#172b26" font-weight="400">custom.care</text>
